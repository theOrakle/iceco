    <line x1="0" y1="-22" x2="0" y2="22"/>
    <line x1="-19" y1="-11" x2="19" y2="11"/>
    <line x1="-19" y1="11" x2="19" y2="-11"/>
    <g stroke-width="5">
      <path d="M0 -22 l-7 7 M0 -22 l7 7 M0 22 l-7 -7 M0 22 l7 -7"/>
      <path d="M-19 -11 l1 -10 M-19 -11 l-9 -3 M19 11 l-1 10 M19 11 l9 3"/>
      <path d="M-19 11 l-9 3 M-19 11 l1 10 M19 -11 l9 -3 M19 -11 l-1 -10"/>
